<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<title>مختبر النابض الافتراضي</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: a single lab notebook column; a sticky header with the ten research steps as a progress rail. */
:root{
  --bg:#EEF2F5; --paper:#FFFFFF; --ink:#14263A; --muted:#5B6B7C; --line:#D5DEE7;
  --steel:#2F6690; --steel-soft:#E1ECF5; --brass:#B7791F; --brass-soft:#F8EEDC;
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --bad:#B23A3A; --bad-soft:#F8E4E4;
  --spring:#7A8896; --rulerbg:#FBF6E8;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1720; --paper:#16212C; --ink:#E6EDF3; --muted:#9AAAB9; --line:#2A3A4A;
  --steel:#6FA8D6; --steel-soft:#1C3145; --brass:#E0A84A; --brass-soft:#3A2E18;
  --ok:#5CC08A; --ok-soft:#18321F; --bad:#E27272; --bad-soft:#3A1C1C; --spring:#A9B6C2; --rulerbg:#2A2618; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1720; --paper:#16212C; --ink:#E6EDF3; --muted:#9AAAB9; --line:#2A3A4A;
  --steel:#6FA8D6; --steel-soft:#1C3145; --brass:#E0A84A; --brass-soft:#3A2E18;
  --ok:#5CC08A; --ok-soft:#18321F; --bad:#E27272; --bad-soft:#3A1C1C; --spring:#A9B6C2; --rulerbg:#2A2618; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;direction:rtl}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:8px;background:#fff;object-fit:contain;flex:none}
.brand{min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12.5px}
.who{font-size:13px;background:var(--steel-soft);color:var(--steel);padding:4px 10px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.rail{max-width:860px;margin:0 auto;padding:0 16px 10px;display:flex;gap:4px}
.rail .rl{flex:1;height:8px;border-radius:4px;background:var(--line);border:0;padding:0;cursor:pointer}
.rail .rl.done{background:var(--steel)} .rail .rl.cur{background:var(--brass)}
.pts{margin-inline-start:auto;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:1px 9px}
h3{font-family:var(--f-display);font-size:19px;margin:22px 0 6px}
.wrongs{padding-inline-start:20px} .wrongs li{margin:6px 0} .wrongs a{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.stat{background:var(--steel-soft);border-radius:10px;padding:10px 14px}
.stat .sv{font-family:var(--f-display);font-size:28px;color:var(--steel);line-height:1.2}
.stat .sl{font-size:13px;color:var(--muted)}
.sortb{font:inherit;font-weight:700;color:inherit;background:none;border:0;cursor:pointer;padding:0} .sortb.on{text-decoration:underline}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,4vw,30px);margin-top:20px}
.eyebrow{font-size:12.5px;letter-spacing:.02em;color:var(--brass);font-weight:700}
h1,h2{font-family:var(--f-display);line-height:1.35;text-wrap:balance;margin:.2em 0 .4em}
h1{font-size:clamp(26px,5vw,36px)} h2{font-size:clamp(21px,4vw,26px)}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)}
.law{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;display:inline-block;background:var(--steel-soft);color:var(--steel);padding:2px 10px;border-radius:6px}
.note{background:var(--brass-soft);border-inline-start:4px solid var(--brass);padding:12px 16px;border-radius:8px;margin:12px 0}
.info{background:var(--steel-soft);border-inline-start:4px solid var(--steel);padding:12px 16px;border-radius:8px;margin:12px 0}
.q{border-top:1px dashed var(--line);padding-top:16px;margin-top:18px}
.q:first-of-type{border-top:0}
.qh{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.qn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--steel);color:var(--paper);display:grid;place-items:center;font-size:14px;margin-top:2px}
.qh span:last-child{min-width:0}
.mark{margin-inline-start:auto;font-size:13px;padding:2px 10px;border-radius:99px;white-space:nowrap}
.mark.ok{background:var(--ok-soft);color:var(--ok)} .mark.bad{background:var(--bad-soft);color:var(--bad)} .mark.part{background:var(--brass-soft);color:var(--brass)}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:start;width:100%;font:inherit;color:inherit;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt:hover{border-color:var(--steel)}
.opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);margin-top:4px}
.opt.multi .dot{border-radius:4px}
.opt.sel{border-color:var(--steel);background:var(--steel-soft)} .opt.sel .dot{background:var(--steel);border-color:var(--steel)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1.5px dashed var(--line);border-radius:10px;margin:10px 0;min-height:52px}
.bank .lbl{width:100%;font-size:12.5px;color:var(--muted)}
.chip{font:inherit;font-size:15px;padding:5px 12px;border-radius:8px;border:1.5px solid var(--brass);background:var(--brass-soft);color:var(--ink);cursor:grab;touch-action:manipulation}
.chip.picked{outline:3px solid var(--steel);outline-offset:1px}
.chip.used{opacity:.3;cursor:default}
.cloze{line-height:2.6}
.blank{display:inline-block;min-width:130px;min-height:34px;vertical-align:middle;padding:0 10px;border:none;border-bottom:2.5px solid var(--steel);background:var(--steel-soft);border-radius:6px 6px 0 0;font:inherit;color:var(--ink);cursor:pointer;line-height:34px;text-align:center}
.blank.over{background:var(--brass-soft)} .blank.right{border-color:var(--ok);background:var(--ok-soft)} .blank.wrong{border-color:var(--bad);background:var(--bad-soft)}
.blank:empty::after{content:"اسحب كلمة إلى هنا";color:var(--muted);font-size:12.5px}
.cls{display:grid;gap:8px;margin-top:10px}
.clsrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.clsrow>span{min-width:0;flex:1 1 180px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;padding:4px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.seg button.sel{background:var(--steel);border-color:var(--steel);color:var(--paper)}
.seg button.right{background:var(--ok);border-color:var(--ok);color:var(--paper)} .seg button.wrong{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.order{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.order li{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.order li.right{border-color:var(--ok);background:var(--ok-soft)} .order li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.order .n{flex:none;font-family:var(--f-mono);color:var(--brass);width:22px;text-align:center}
.order .t{flex:1;min-width:0}
.order .mv{display:flex;flex-direction:column;gap:2px}
.order .mv button{font-size:12px;line-height:1;padding:3px 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);cursor:pointer}
.num{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.num input{width:150px;direction:ltr;text-align:center;font-family:var(--f-mono)}
.num input.right{border-color:var(--ok);background:var(--ok-soft)} .num input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.unit{font-family:var(--f-mono);color:var(--muted);direction:ltr}
.fb{font-size:14px;margin-top:6px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 20px;border:2px solid var(--steel);background:var(--steel);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--steel)}
.btn.brass{background:var(--brass);border-color:var(--brass)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13.5px;color:var(--muted)}
/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;margin-top:12px}
@media (max-width:700px){.lab{grid-template-columns:1fr}}
.bench{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:flex-start;justify-content:center}
.bench svg{display:block;min-width:0}
.bench>svg{flex:1 1 auto}
.mag{width:150px;flex:none}
.mag .cap{font-size:12px;color:var(--muted);text-align:center}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ctl .btn{padding:7px 14px;font-size:15px}
.trials{display:flex;gap:4px}
.state{font-size:14px;color:var(--muted);margin:4px 0 8px}
.state b{color:var(--ink);font-family:var(--f-mono)}
.tblw{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
table.data th,table.data td{border:1px solid var(--line);padding:5px 6px;text-align:center}
table.data th{background:var(--steel-soft);color:var(--steel);font-weight:700;font-size:13px}
table.data td input{width:72px;padding:4px 6px;direction:ltr;text-align:center;font-family:var(--f-mono);font-size:14px}
table.data td input.now{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass-soft)}
table.data td input.right{border-color:var(--ok);background:var(--ok-soft)} table.data td input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ltr{direction:ltr;unicode-bidi:isolate}
.steps{padding-inline-start:22px} .steps li{margin:4px 0}
.up{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--steel);border-radius:10px;padding:14px;margin:12px 0}
.up img{max-height:220px;border-radius:8px;border:1px solid var(--line)}
.grade{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--steel)}
.code{font-family:var(--f-mono);font-size:22px;letter-spacing:.15em;background:var(--brass-soft);padding:4px 12px;border-radius:8px;direction:ltr;display:inline-block}
footer.sig{text-align:center;color:var(--muted);font-size:14px;margin-top:28px}
footer.sig b{color:var(--ink)}
details.teacher{margin-top:16px;font-size:14px}
details.teacher summary{cursor:pointer;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.err{color:var(--bad);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 20px}
.lbl{font-weight:700;display:block;margin:14px 0 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.keys{display:flex;gap:24px;flex-wrap:wrap;margin:10px 0}
.keys .code{font-size:26px}
.pill{font-size:12.5px;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.submitted{background:var(--ok-soft);color:var(--ok)} .pill.started{background:var(--brass-soft);color:var(--brass)}
.btn.mini{padding:3px 10px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.brandmark{width:44px;height:44px;flex:none;border-radius:10px;background:var(--steel-soft);display:grid;place-items:center}
@media print{header.top,.noprint,footer.sig{display:none!important}.card{border:0;padding:0}body{background:#fff;color:#000}table.data th{background:#eee!important;color:#000!important}}

.prof{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:8px 0}
.pcol{border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:10px;padding:10px 14px}
.pcol.good{border-inline-start-color:var(--ok);background:var(--ok-soft)} .pcol.weak{border-inline-start-color:var(--bad);background:var(--bad-soft)}
.pcol ul{margin:6px 0 0;padding-inline-start:18px} .pcol li{margin:3px 0}
.bars{display:grid;gap:6px;margin:8px 0}
.bar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(80px,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.bar .bl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{height:12px;border-radius:6px;background:var(--line);overflow:hidden;display:block}
.bar .bt i{display:block;height:100%;border-radius:6px}
.bar .bt i.low{background:var(--bad)} .bar .bt i.mid{background:var(--brass)} .bar .bt i.high{background:var(--ok)}
.bar .bv{font-family:var(--f-mono);text-align:end}
@media (max-width:520px){.bar{grid-template-columns:1fr 44px}.bar .bl{grid-column:1/-1;white-space:normal}}
</style>


</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 40" width="18" height="30"><path d="M12 1v4 l8 2.5 -16 3 16 3 -16 3 16 3 -16 3 16 3 -8 2.5v4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" style="color:var(--steel)"/><rect x="6" y="33" width="12" height="6" rx="1.5" fill="var(--brass)"/></svg></div>
    <div class="brand"><b>مختبر النابض الافتراضي</b><small>اختبار محوسب في البحث العلمي · إيجاد ثابت النابض</small></div>
    <div class="who" id="who" hidden></div>
  </div>
  <div class="rail" id="rail"></div>
</header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer class="sig">إعداد المعلمة: <b>منى مصطفى</b></footer></div>
<script>
'use strict';
// ---------- utilities ----------
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v); }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e; };
const norm = s => s.trim().replace(/\s+/g, ' ').replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();
const fnv = s => { let x = 2166136261 >>> 0; for (const c of s) { x ^= c.codePointAt(0); x = Math.imul(x, 16777619) >>> 0; } return x >>> 0; };
const rngFrom = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const shuffle = (arr, r) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = (x, d = 2) => (Math.round(x * 10 ** d) / 10 ** d).toString();
const verify = (name, grade) => fnv('spring-lab|' + norm(name) + '|' + grade).toString(36).toUpperCase().padStart(7, '0').slice(-6);
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ---------- per-student experiment ----------
const G = 10, MASSES = [0, 50, 100, 150, 200, 250];
let S = null;   // state
let P = null;   // personal parameters
function makeParams(name) {
  const r = rngFrom(fnv(norm(name)));
  const k = 12 + Math.floor(r() * 57) * 0.5;            // 12 … 40 N/m
  const L0 = 8 + Math.round(r() * 60) / 10;             // 8.0 … 14.0 cm
  const noise = [0, 1, 2].map(() => MASSES.map((m, i) => (r() - 0.5) * (i ? 0.24 : 0.08)));
  const kq = [15, 20, 25, 30, 40, 50, 60][Math.floor(r() * 7)], fq = [1, 1.5, 2, 2.5, 3, 4][Math.floor(r() * 6)];
  const mq = [70, 80, 120, 180, 220, 300][Math.floor(r() * 6)];
  return { k, L0, noise, kq, fq, mq, seed: fnv(norm(name)) };
}
const trueL = (t, i) => P.L0 + (MASSES[i] * G / 1000) / P.k * 100 + P.noise[t][i];
const readOf = (t, i) => Math.round(trueL(t, i) * 10) / 10;

// student's own data → regression (ΔL in m vs F)
function myData() {
  const rows = MASSES.map((m, i) => { const F = m * G / 1000; const dl = [0, 1, 2].map(t => { const L = parseFloat(S.read[t][i]), L0 = parseFloat(S.read[t][0]); return isFinite(L) && isFinite(L0) ? L - L0 : NaN; });
    const ok = dl.filter(isFinite); const avg = ok.length ? ok.reduce((a, b) => a + b, 0) / ok.length : NaN; return { m, F, dl, avg }; });
  const pts = rows.filter(r => isFinite(r.avg)).map(r => [r.F, r.avg / 100]);
  const n = pts.length, sx = pts.reduce((a, p) => a + p[0], 0), sy = pts.reduce((a, p) => a + p[1], 0);
  const sxx = pts.reduce((a, p) => a + p[0] * p[0], 0), sxy = pts.reduce((a, p) => a + p[0] * p[1], 0);
  const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx);
  return { rows, slope };
}

// ---------- question bank ----------
const STEPS = [
 { tag: 'الخطوة 1', title: 'الملاحظة الدقيقة للظاهرة', intro: () => [
     h('p', {}, 'هذا نابض معلّق. حرّك المؤشر لتسحب النابض بيدك بقوة أكبر أو أصغر، ثم اضغط «اترك النابض». راقب ما يحدث بموضوعية.'), handSpring()],
   items: [
   { id: 'o1', type: 'mcq', w: 2, q: 'ماذا لاحظت عندما زدت قوة السحب؟', a: 'تزداد استطالة النابض', d: ['يقصر النابض', 'لا يتغير طول النابض', 'يزداد طول النابض ثم يقصر وحده رغم استمرار السحب'] },
   { id: 'o2', type: 'mcq', w: 2, q: 'ماذا يحدث عندما تترك النابض بعد سحب خفيف؟', a: 'يعود إلى طوله الأصلي', d: ['يبقى مشدوداً بنفس الطول', 'يصبح أقصر من طوله الأصلي بشكل دائم', 'يستمر في الاستطالة'] } ] },

function grade(it) {

// ---------- springs ----------
function springPath(x, y0, y1, coils = 22, w = 16) {

  for (let i = 0; i < coils; i++) { const ya = y0 + lead + len * (i + 0.25) / coils, yb = y0 + lead + len * (i + 0.75) / coils; d += ` L${x + w},${ya} L${x - w},${yb}`; }
  return d + ` L${x},${y1 - lead} L${x},${y1}`;
}
const NS = 'http://www.w3.org/2000/svg';

  svg.append(sp, hand);

  const slider = h('input', { type: 'range', min: 0, max: 100, value: 0, id: 'pull', style: 'width:100%;max-width:420px' });

  const animate = () => { const t = (performance.now() - t0) / 1000; const y = L(0) + (from - L(0)) * Math.exp(-t * 2.2) * Math.cos(t * 11); draw(y); if (t < 3) raf = requestAnimationFrame(animate); else draw(L(0)); };
